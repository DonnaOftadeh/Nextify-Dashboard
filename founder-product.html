<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Founder • Breakthrough product</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body{font-family:'Inter',sans-serif}.focusable:focus{outline:2px solid #2563eb;outline-offset:2px} </style>
</head>
<body class="bg-gray-50">
  <nav class="bg-white shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold text-blue-700">Nextify</a>
      <a href="roles-founder.html" class="text-sm text-gray-600 hover:text-blue-600 focusable">Back</a>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-2">Breakthrough product</h1>
    <p class="text-gray-600 mb-8">Start from a product scope. We’ll explore differentiation, feasibility, and GTM.</p>

    <form id="productForm" class="bg-white rounded-2xl shadow p-6 space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-800 mb-1">Product/category</label>
        <input id="product" type="text" class="w-full border rounded-xl px-4 py-3" placeholder="e.g., AI therapy assistant" required>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-800 mb-1">Key features / scope</label>
        <textarea id="features" class="w-full border rounded-xl px-4 py-3" rows="4" placeholder="e.g., voice chat, offline mode, HIPAA-ready"></textarea>
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-800 mb-1">Primary users</label>
          <input id="users" type="text" class="w-full border rounded-xl px-4 py-3" placeholder="e.g., therapists, students">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-800 mb-1">Target markets</label>
          <input id="markets" type="text" class="w-full border rounded-xl px-4 py-3" placeholder="e.g., EU, US, India">
        </div>
      </div>
      <button type="submit" class="focusable inline-flex items-center justify-center px-6 py-3 rounded-full bg-rose-600 text-white font-semibold hover:bg-rose-700">Continue</button>
    </form>

    <p class="text-xs text-gray-500 mt-4">Params go as <code>?entry=product&product=...&features=...&users=...&markets=...</code></p>
  </main>

  <script>
    document.getElementById('productForm').addEventListener('submit', function(e){
      e.preventDefault();
      const params = new URLSearchParams({
        entry: 'product',
        product: document.getElementById('product').value,
        features: document.getElementById('features').value,
        users: document.getElementById('users').value,
        markets: document.getElementById('markets').value
      });
      window.location.href = 'https://nextify-dashboard-100.streamlit.app/?' + params.toString();
    });
  </script>
</body>
</html>
