<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nextify – Submit Your Idea</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-3xl mx-auto py-8 px-4">
    <a href="roles-founder.html" class="text-sm text-gray-500">&larr; Back</a>
    <h1 class="text-3xl font-bold mt-2">Start with your Idea</h1>
    <p class="text-gray-600 mb-4">
      Tell us your idea; we’ll generate a structured innovation report.
    </p>

    <div id="apiBadge" class="hidden bg-red-100 text-red-700 px-3 py-2 rounded mb-4">
      API: Not reachable
    </div>

    <form id="idea-form" class="space-y-4">
      <div>
        <label class="block font-semibold">Idea title <span class="text-red-500">*</span></label>
        <input type="text" name="idea_title" placeholder="e.g., Global Innovation Platform"
               class="w-full border rounded px-3 py-2" required />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block font-semibold">Current stage <span class="text-red-500">*</span></label>
          <select name="current_stage" class="w-full border rounded px-3 py-2" required>
            <option value="">Choose a stage...</option>
            <option>Idea only</option>
            <option>Prototype</option>
            <option>MVP</option>
            <option>Growth</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold">Region</label>
          <input type="text" name="region" value="Global"
                 class="w-full border rounded px-3 py-2" />
          <p class="text-sm text-gray-500 mt-1">
            Default is Global; you can specify e.g., Berlin, EU, US-East.
          </p>
        </div>
      </div>

      <div>
        <label class="block font-semibold">What problem does it solve? <span class="text-red-500">*</span></label>
        <textarea name="problem" placeholder="e.g., Founders and accelerators struggle to discover one another globally..."
                  class="w-full border rounded px-3 py-2" required></textarea>
      </div>

      <div>
        <label class="block font-semibold">Who is it for? <span class="text-red-500">*</span></label>
        <input type="text" name="target_users"
               placeholder="e.g., Accelerators; Founders; Investors; Kids; Educators"
               class="w-full border rounded px-3 py-2" required />
      </div>

      <div>
        <label class="block font-semibold">Constraints (optional)</label>
        <textarea name="constraints" class="w-full border rounded px-3 py-2"></textarea>
      </div>

      <button type="submit"
              class="bg-blue-600 text-white px-5 py-2 rounded font-medium hover:bg-blue-700">
        Submit Idea
      </button>
    </form>
  </div>

  <script>
    // ==== CONFIG: set to your current ngrok https URL ====
    const NEXTIFY_API_BASE = "https://gilbert-unbridged-rumbly.ngrok-free.app";

    // --- Improved API check ---
    async function checkApi() {
      const badge = document.getElementById("apiBadge");
      try {
        const r = await fetch(`${NEXTIFY_API_BASE}/`, {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          credentials: "omit",
          headers: { "Accept": "application/json" }
        });

        const ct = (r.headers.get("content-type") || "").toLowerCase();
        if (!r.ok) {
          badge.textContent = `API: ${r.status} ${r.statusText}`;
          badge.classList.remove("hidden");
          return;
        }
        if (!ct.includes("application/json")) {
          badge.textContent = "API: Not reachable (non-JSON response)";
          badge.classList.remove("hidden");
          return;
        }

        const data = await r.json();
        if (!data || data.ok !== true) {
          badge.textContent = "API: Healthcheck failed";
          badge.classList.remove("hidden");
          return;
        }
        // All good: keep hidden
      } catch (e) {
        badge.textContent = `API: Not reachable (${e.message})`;
        badge.classList.remove("hidden");
      }
    }
    checkApi();

    // --- Handle submit ---
    (function () {
      const form = document.getElementById("idea-form");
      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const fd = new FormData(form);

        const payload = {
          idea_title:    (fd.get("idea_title") || "").trim(),
          current_stage: (fd.get("current_stage") || "").trim(),
          problem:       (fd.get("problem") || "").trim(),
          target_users:  (fd.get("target_users") || "").trim(),
          constraints:   (fd.get("constraints") || "").trim(),
          region:        (fd.get("region") || "Global").trim()
        };

        const body = { journey_type: "idea", payload };
        try {
          const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
          window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}`;
        } catch (err) {
          alert("Submit failed: " + err.message);
        }
      });
    })();
  </script>
</body>
</html>
