<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nextify • Founder Idea</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="p-4 border-b bg-white">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-600">Nextify</h1>
      <a href="roles-founder.html" class="text-sm text-gray-500 hover:text-gray-800">← Back to roles</a>
    </div>
  </header>

  <main class="flex-grow p-6 max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold mb-2">Founder • Start with your Idea</h2>
    <p class="text-gray-600 mb-4">Tell us your idea and who it serves. We’ll generate a structured innovation report and guide you through the journey.</p>

    <div id="api-status" class="hidden mb-4 rounded p-2 text-sm"></div>

    <form id="idea-form" data-journey="idea" class="space-y-4 bg-white p-6 rounded-lg shadow">
      <div>
        <label for="idea_title" class="block text-sm font-medium text-gray-700">Idea title *</label>
        <input type="text" id="idea_title" name="idea_title" placeholder="e.g., Global Innovation Platform"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required />
      </div>
      <div>
        <label for="stage" class="block text-sm font-medium text-gray-700">Current stage *</label>
        <select id="stage" name="stage"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
          <option value="">Choose a stage...</option>
          <option value="idea">Idea</option>
          <option value="prototype">Prototype</option>
          <option value="mvp">MVP</option>
          <option value="growth">Growth</option>
        </select>
      </div>
      <div>
        <label for="region" class="block text-sm font-medium text-gray-700">Region *</label>
        <input type="text" id="region" name="region" placeholder="e.g., Europe, North America"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required />
      </div>
      <div>
        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
        <textarea id="description" name="description" rows="3"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
      </div>
      <button type="submit"
        class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700">Submit</button>
    </form>
  </main>

  <script>
    // --- API base and ngrok param bypass ---
    const NEXTIFY_API_BASE = "https://gilbert-unbridged-rumbly.ngrok-free.app";
    const NGROK_PARAM = "ngrok-skip-browser-warning=true";
    const api = (path) => {
      const sep = path.includes("?") ? "&" : "?";
      return `${NEXTIFY_API_BASE}${path}${sep}${NGROK_PARAM}`;
    };

    // Connectivity check
    (async () => {
      const statusEl = document.getElementById("api-status");
      try {
        const r = await fetch(api("/"), { cache: "no-store", mode: "cors" });
        const ct = (r.headers.get("content-type") || "").toLowerCase();
        if (!r.ok || !ct.includes("json")) throw new Error(`Bad status or type: ${r.status} ${ct}`);

        statusEl.classList.remove("hidden");
        statusEl.classList.add("bg-green-50", "text-green-700", "border", "border-green-200");
        statusEl.textContent = "API connected successfully.";
      } catch (e) {
        statusEl.classList.remove("hidden");
        statusEl.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
        statusEl.textContent = "API not reachable (ngrok interstitial/CORS). " + (e?.message || "");
      }
    })();

    // Submit
    (function () {
      const form = document.getElementById("idea-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const journeyType = form.dataset.journey;
        const payload = Object.fromEntries(new FormData(form).entries());

        const btn = form.querySelector('button[type="submit"]');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Submitting…";

        try {
          const res = await fetch(api("/api/submit"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ journey_type: journeyType, payload })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.job_id) throw new Error(data.detail || "Submit failed");

          const q = new URLSearchParams({ job_id: data.job_id, journey: journeyType });
          window.location.href = `founder-processing.html?${q.toString()}`;
        } catch (err) {
          console.error(err);
          alert("Something went wrong while submitting your idea.");
          btn.disabled = false;
          btn.textContent = originalText;
        }
      });
    })();
  </script>
</body>
</html>
