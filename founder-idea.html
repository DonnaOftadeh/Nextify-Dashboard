<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Founder – Submit Idea</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Only makes the asterisks red */
    .req { color: red; }
  </style>
</head>
<body>
  <h1>Submit Your Idea</h1>

  <form id="idea-form">
    <label for="idea_title">Idea title <span class="req">*</span></label>
    <input type="text" id="idea_title" name="idea_title" required />

    <label for="problem">What problem does it solve? <span class="req">*</span></label>
    <textarea id="problem" name="problem" required></textarea>

    <label for="target_users">Who is it for? <span class="req">*</span></label>
    <input type="text" id="target_users" name="target_users" required />

    <label for="current_stage">Current stage <span class="req">*</span></label>
    <select id="current_stage" name="current_stage" required>
      <option value="">Choose a stage…</option>
      <option value="Concept">Concept</option>
      <option value="Prototype">Prototype</option>
      <option value="MVP">MVP</option>
      <option value="Growth">Growth</option>
    </select>

    <label for="constraints">Constraints (optional)</label>
    <textarea id="constraints" name="constraints"></textarea>

    <label for="region">Region</label>
    <input type="text" id="region" name="region" value="Global" />

    <button type="submit" id="submitBtn">Submit Idea</button>
  </form>

  <script>
  (function () {
    // Your ngrok URL (replace when it changes)
    const NEXTIFY_API_BASE = "https://gilbert-unbridged-rumbly.ngrok-free.app";

    const form = document.getElementById("idea-form");
    const btn  = document.getElementById("submitBtn");

    function payloadFromForm(formEl) {
      const fd = new FormData(formEl);
      return {
        idea_title:    (fd.get("idea_title")    || "").trim(),
        problem:       (fd.get("problem")       || "").trim(),
        target_users:  (fd.get("target_users")  || "").trim(),
        current_stage: (fd.get("current_stage") || "").trim(),
        constraints:   (fd.get("constraints")   || "").trim(),
        region:        (fd.get("region")        || "Global").trim()
      };
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const body = { journey_type: "idea", payload: payloadFromForm(form) };

      const oldTxt = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Submitting…";

      try {
        const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
        window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}`;
      } catch (err) {
        alert("Submit failed.\n\n" + err.message);
        btn.disabled = false;
        btn.textContent = oldTxt;
      }
    });
  })();
  </script>
</body>
</html>
