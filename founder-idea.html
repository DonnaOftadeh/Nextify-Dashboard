<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nextify – Idea</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto py-12 px-4">
    <h1 class="text-2xl font-bold mb-6">Start with your Idea</h1>
    <p class="text-gray-600 mb-8">Tell us your idea, we’ll generate a structured innovation report.</p>

    <form id="idea-form" class="space-y-6">
      <div>
        <label for="idea_title" class="block font-medium">Idea title *</label>
        <input type="text" id="idea_title" name="idea_title" required class="w-full border p-2 rounded" placeholder="e.g., Global Innovation Platform" />
      </div>

      <div>
        <label for="current_stage" class="block font-medium">Current stage *</label>
        <select id="current_stage" name="current_stage" required class="w-full border p-2 rounded">
          <option value="">Choose a stage…</option>
          <option>Idea only</option>
          <option>Prototype</option>
          <option>MVP</option>
          <option>Growth</option>
        </select>
      </div>

      <div>
        <label for="problem" class="block font-medium">What problem does it solve? *</label>
        <textarea id="problem" name="problem" required class="w-full border p-2 rounded" placeholder="e.g., Founders can’t easily connect with global investors…"></textarea>
      </div>

      <div>
        <label for="target_users" class="block font-medium">Who is it for? *</label>
        <input type="text" id="target_users" name="target_users" required class="w-full border p-2 rounded" placeholder="e.g., Accelerators; Founders; Investors; Kids; Educators" />
      </div>

      <div>
        <label for="constraints" class="block font-medium">Constraints (optional)</label>
        <textarea id="constraints" name="constraints" class="w-full border p-2 rounded" placeholder="e.g., Solo founder, limited budget, need design help"></textarea>
      </div>

      <div>
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded">Continue</button>
      </div>
    </form>
  </div>

  <script>
  (function () {
    let NEXTIFY_API_BASE = localStorage.getItem("NEXTIFY_API_BASE") || "";
    if (!/^https:\/\/.+/.test(NEXTIFY_API_BASE)) {
      const v = prompt("Enter your API base (ngrok https URL):", "https://xxxxx.ngrok-free.app");
      if (v && /^https:\/\/.+/.test(v.trim())) {
        NEXTIFY_API_BASE = v.trim();
        localStorage.setItem("NEXTIFY_API_BASE", NEXTIFY_API_BASE);
      }
    }

    const form = document.getElementById("idea-form");
    if (!form) return;

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();

      const fd = new FormData(form);
      const payload = {};
      for (const [k, v] of fd.entries()) payload[k] = (v ?? "").toString().trim();
      if (!("region" in payload)) payload.region = "Global";

      const body = { journey_type: "idea", payload };

      const btn = form.querySelector('[type="submit"]');
      const oldTxt = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Submitting…";

      try {
        const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
        window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}`;
      } catch (err) {
        alert("Submit failed. Check API/ngrok.\n\n" + err.message);
        btn.disabled = false;
        btn.textContent = oldTxt;
      }
    });
  })();
  </script>
</body>
</html>
