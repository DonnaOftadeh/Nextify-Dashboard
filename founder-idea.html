<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Founder – Submit Idea</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Submit Your Idea</h1>

  <form id="idea-form">
    <label>Idea title<br />
      <input type="text" name="idea_title" required />
    </label>
    <br /><br />

    <label>What problem does it solve?<br />
      <textarea name="problem" required></textarea>
    </label>
    <br /><br />

    <label>Who is it for?<br />
      <input type="text" name="target_users" required />
    </label>
    <br /><br />

    <label>Current stage<br />
      <select name="current_stage" required>
        <option value="Concept">Concept</option>
        <option value="Prototype">Prototype</option>
        <option value="MVP">MVP</option>
        <option value="Growth">Growth</option>
      </select>
    </label>
    <br /><br />

    <label>Constraints (optional)<br />
      <textarea name="constraints"></textarea>
    </label>
    <br /><br />

    <label>Region<br />
      <input type="text" name="region" value="Global" />
    </label>
    <br /><br />

    <button type="submit">Submit Idea</button>
  </form>

  <script>
  (function () {
    let NEXTIFY_API_BASE = localStorage.getItem("NEXTIFY_API_BASE") || "";
    if (!NEXTIFY_API_BASE || !/^https:\/\/.+/.test(NEXTIFY_API_BASE)) {
      const v = prompt("Enter your API base (ngrok https URL):", "https://xxxx.ngrok-free.app");
      if (v && /^https:\/\/.+/.test(v.trim())) {
        NEXTIFY_API_BASE = v.trim();
        localStorage.setItem("NEXTIFY_API_BASE", NEXTIFY_API_BASE);
      }
    }

    const form = document.getElementById("idea-form");
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const fd = new FormData(form);
      const payload = Object.fromEntries(fd.entries());
      const body = { journey_type: "idea", payload };

      const btn = form.querySelector('[type="submit"]');
      const oldTxt = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Submitting…";

      try {
        const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
        window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}`;
      } catch (err) {
        alert("Submit failed.\n\n" + err.message);
        btn.disabled = false;
        btn.textContent = oldTxt;
      }
    });
  })();
  </script>
</body>
</html>
