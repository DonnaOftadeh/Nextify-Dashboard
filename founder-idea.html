<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nextify – Idea</title>

  <!-- Same CSS stack as other pages -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* tiny helpers to mirror your other forms */
    .field-label { @apply block text-sm font-medium text-gray-800 mb-1; }
    .field-help  { @apply text-xs text-gray-500 mt-1; }
    .control     { @apply w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-gray-900
                          shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600; }
    .card        { @apply bg-white rounded-2xl shadow-sm border border-gray-100 p-5; }
    .btn-primary { @apply inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-2.5
                          text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed; }
    .btn-ghost   { @apply inline-flex items-center justify-center rounded-xl border border-gray-300
                          px-4 py-2.5 text-gray-700 hover:bg-gray-50; }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">
  <!-- Top bar like other pages -->
  <header class="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-gray-100">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-lg font-semibold text-blue-700">Nextify</a>
      <a href="roles-founder.html" class="text-sm text-gray-600 hover:text-gray-800">← Back</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-10">
    <div class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">Start with your Idea</h1>
      <p class="text-gray-600 mt-2">Tell us your idea, we’ll generate a structured innovation report.</p>
    </div>

    <!-- Content card matches other pages -->
    <form id="idea-form" class="card space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="md:col-span-2">
          <label for="idea_title" class="field-label">Idea title <span class="text-red-500">*</span></label>
          <input id="idea_title" name="idea_title" type="text" required
                 class="control"
                 placeholder="e.g., Global Innovation Platform" />
        </div>

        <div>
          <label for="current_stage" class="field-label">Current stage <span class="text-red-500">*</span></label>
          <select id="current_stage" name="current_stage" required class="control">
            <option value="">Choose a stage…</option>
            <option>Idea only</option>
            <option>Prototype</option>
            <option>MVP</option>
            <option>Growth</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label for="problem" class="field-label">What problem does it solve? <span class="text-red-500">*</span></label>
          <textarea id="problem" name="problem" rows="5" required
                    class="control"
                    placeholder="e.g., Founders and accelerators struggle to discover one another globally; discovery and collaboration are fragmented."></textarea>
        </div>

        <div class="md:col-span-2">
          <label for="target_users" class="field-label">Who is it for? <span class="text-red-500">*</span></label>
          <input id="target_users" name="target_users" type="text" required
                 class="control"
                 placeholder="e.g., Accelerators; Founders; Investors; Kids; Educators" />
        </div>

        <div class="md:col-span-2">
          <label for="constraints" class="field-label">Constraints (optional)</label>
          <textarea id="constraints" name="constraints" rows="3"
                    class="control"
                    placeholder="e.g., Solo founder; limited budget; need design help"></textarea>
          <p class="field-help">Add anything that may affect scope, timeline, or feasibility.</p>
        </div>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <a href="roles-founder.html" class="btn-ghost">Cancel</a>
        <button type="submit" class="btn-primary">Continue</button>
      </div>
    </form>
  </main>

  <!-- Backend wiring: same behavior, no visual intrusion -->
  <script>
  (function () {
    // Get (or set once) your ngrok/API base so you don’t hardcode it in HTML.
    let NEXTIFY_API_BASE = localStorage.getItem("NEXTIFY_API_BASE") || "";
    if (!/^https:\/\/.+/.test(NEXTIFY_API_BASE)) {
      const v = prompt("Enter your API base (ngrok https URL):", "https://xxxxx.ngrok-free.app");
      if (v && /^https:\/\/.+/.test(v.trim())) {
        NEXTIFY_API_BASE = v.trim();
        localStorage.setItem("NEXTIFY_API_BASE", NEXTIFY_API_BASE);
      }
    }

    const form = document.getElementById("idea-form");
    if (!form) return;

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();

      // Serialize without renaming so it matches your backend expectation
      const fd = new FormData(form);
      const payload = {};
      for (const [k, v] of fd.entries()) payload[k] = (v ?? "").toString().trim();
      if (!("region" in payload)) payload.region = "Global";

      const body = { journey_type: "idea", payload };

      const btn = form.querySelector('[type="submit"]');
      const oldTxt = btn.textContent;
      btn.disabled = true; btn.textContent = "Submitting…";

      try {
        const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);

        // Go to progress page like your other flows
        window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}`;
      } catch (err) {
        alert("Submit failed. Please check API/ngrok.\n\n" + err.message);
        btn.disabled = false; btn.textContent = oldTxt;
      }
    });
  })();
  </script>
</body>
</html>
