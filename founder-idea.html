<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nextify — Start with your Idea</title>
  <!-- Keep your existing CSS links here if you have them -->
  <style>
    /* Minimal, non-invasive defaults. Remove if you already have CSS. */
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background:#fff; color:#111; }
    .container { max-width: 1040px; margin: 0 auto; padding: 24px; }
    h1 { font-weight: 700; margin: 0 0 8px; }
    .sub { color:#555; margin: 0 0 24px; }
    form label { display:block; font-weight:600; margin:18px 0 8px; }
    input[type="text"], textarea, select {
      width:100%; padding:14px 12px; border-radius:10px; border:1px solid #d0d7de; font-size:16px; background:#fff;
    }
    textarea { min-height: 140px; resize: vertical; }
    .actions { margin-top: 24px; display:flex; gap:12px; }
    button { background:#2563eb; color:#fff; border:none; padding:12px 18px; border-radius:10px; font-size:16px; cursor:pointer; }
    button[disabled] { opacity:.6; cursor:not-allowed; }
    .topbar { padding:18px 0; border-bottom:1px solid #eee; }
    .brand { color:#2563eb; font-weight:800; font-size:22px; letter-spacing:.2px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container">
      <span class="brand">Nextify</span>
    </div>
  </div>

  <div class="container">
    <h1>Start with your Idea</h1>
    <p class="sub">Tell us your idea; we’ll generate a structured innovation report.</p>

    <!-- Keep your original field names -->
    <form id="idea-form">
      <label for="idea_title">Idea title *</label>
      <input type="text" id="idea_title" name="idea_title" placeholder="e.g., Global Innovation Platform" required />

      <label for="current_stage">Current stage *</label>
      <select id="current_stage" name="current_stage" required>
        <option value="" selected>Choose a stage...</option>
        <option value="Idea">Idea</option>
        <option value="Prototype">Prototype</option>
        <option value="MVP">MVP</option>
        <option value="Growth">Growth</option>
      </select>

      <label for="problem">What problem does it solve? *</label>
      <textarea id="problem" name="problem" placeholder="e.g., Founders and accelerators struggle to discover one another globally; discovery and collaboration are fragmented." required></textarea>

      <label for="target_users">Who is it for? *</label>
      <input type="text" id="target_users" name="target_users" placeholder="e.g., Accelerators; Founders; Investors; Kids; Educators" required />

      <label for="constraints">Constraints (optional)</label>
      <textarea id="constraints" name="constraints" placeholder="e.g., Solo founder; limited budget; need design help"></textarea>

      <label for="region">Region</label>
      <input type="text" id="region" name="region" value="Global" />

      <div class="actions">
        <button type="submit" id="submitBtn">Continue</button>
      </div>
    </form>
  </div>

  <!-- Backend connector: ONLY logic, no design changes -->
  <script>
  (function () {
    // Stable ngrok URL (custom domain you shared)
    const NEXTIFY_API_BASE = "https://gilbert-unbridged-rumbly.ngrok-free.app";

    const form = document.getElementById("idea-form");
    const btn  = document.getElementById("submitBtn");

    function payloadFromForm(formEl) {
      const fd = new FormData(formEl);
      // Keep your original names
      const base = {
        idea_title:    (fd.get("idea_title")    || "").toString().trim(),
        current_stage: (fd.get("current_stage") || "").toString().trim(),
        problem:       (fd.get("problem")       || "").toString().trim(),
        target_users:  (fd.get("target_users")  || "").toString().trim(),
        constraints:   (fd.get("constraints")   || "").toString().trim(),
        region:        (fd.get("region")        || "Global").toString().trim()
      };
      // Also merge any extra fields, just in case
      for (const [k,v] of fd.entries()) {
        if (!(k in base)) base[k] = (v ?? "").toString().trim();
      }
      return base;
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const body = { journey_type: "idea", payload: payloadFromForm(form) };
      const old = btn.textContent;
      btn.disabled = true; btn.textContent = "Submitting…";

      try {
        const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
        window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}`;
      } catch (e) {
        alert("Submit failed. Please check that your backend and ngrok are running.\n\n" + e.message);
        btn.disabled = false; btn.textContent = old;
      }
    });
  })();
  </script>
</body>
</html>
