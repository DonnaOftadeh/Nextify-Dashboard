<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nextify — Founder Idea</title>

  <style>
    :root{
      --fg:#0e0e10; --muted:#6b7280; --brand:#1f6feb; --border:#e5e7eb;
      --bg:#ffffff; --danger:#d92d20;
    }
    body{
      margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
    }
    .container{max-width:960px; margin:40px auto; padding:0 20px;}
    h1{font-size:1.8rem; margin:0 0 6px 0}
    p.lead{color:var(--muted); margin:0 0 28px 0}
    form{display:grid; gap:18px;}
    label{display:block; font-weight:600; margin-bottom:6px}
    .req{color:var(--danger)} /* red asterisk */
    input, select, textarea, button{font:inherit; color:inherit;}
    input[type="text"], select, textarea{
      width:100%; box-sizing:border-box;
      border:1px solid var(--border); border-radius:8px;
      padding:10px 12px; background:#fff;
    }
    textarea{min-height:110px; resize:vertical}
    .row{display:grid; gap:18px}
    @media (min-width:720px){
      .row.two{grid-template-columns:1fr 1fr}
    }
    .actions{display:flex; gap:12px; align-items:center}
    .btn{
      padding:10px 16px; border-radius:8px; border:1px solid transparent;
      background:var(--brand); color:white; cursor:pointer; font-weight:600;
    }
    .btn:disabled{opacity:.6; cursor:not-allowed}
    .helper{color:var(--muted); font-size:.92rem; margin-top:-6px}
  </style>
</head>
<body>
  <main class="container">
    <h1>Start with your Idea</h1>
    <p class="lead">Tell us your idea; we’ll generate a structured innovation report.</p>

    <form id="idea-form" novalidate>
      <div>
        <label for="idea_title">Idea title <span class="req">*</span></label>
        <input type="text" id="idea_title" name="idea_title" placeholder="e.g., Global Innovation Platform" required />
      </div>

      <div class="row two">
        <div>
          <label for="current_stage">Current stage <span class="req">*</span></label>
          <select id="current_stage" name="current_stage" required>
            <option value="">Choose a stage…</option>
            <option value="Idea">Idea</option>
            <option value="Prototype">Prototype</option>
            <option value="MVP">MVP</option>
            <option value="Growth">Growth</option>
          </select>
        </div>
        <div>
          <label for="region">Region</label>
          <input type="text" id="region" name="region" value="Global" />
          <div class="helper">Default is Global; you can specify e.g., Berlin, EU, US-East.</div>
        </div>
      </div>

      <div>
        <label for="problem">What problem does it solve? <span class="req">*</span></label>
        <textarea id="problem" name="problem" placeholder="e.g., Founders and accelerators struggle to discover one another globally; discovery and collaboration are fragmented." required></textarea>
      </div>

      <div>
        <label for="target_users">Who is it for? <span class="req">*</span></label>
        <input type="text" id="target_users" name="target_users" placeholder="e.g., Accelerators; Founders; Investors; Kids; Educators" required />
      </div>

      <div>
        <label for="constraints">Constraints (optional)</label>
        <textarea id="constraints" name="constraints" placeholder="e.g., Solo founder; limited budget; need design help"></textarea>
      </div>

      <div class="actions">
        <button type="submit" id="submitBtn" class="btn">Continue</button>
        <span id="status" class="helper"></span>
      </div>
    </form>
  </main>

  <script>
    (function () {
      // Inserted your ngrok URL here:
      const NEXTIFY_API_BASE = "https://gilbert-unbridged-rumbly.ngrok-free.app";

      const form = document.getElementById("idea-form");
      const btn  = document.getElementById("submitBtn");
      const status = document.getElementById("status");

      function payloadFromForm(formEl) {
        const fd = new FormData(formEl);
        return {
          idea_title:    (fd.get("idea_title")    || "").toString().trim(),
          current_stage: (fd.get("current_stage") || "").toString().trim(),
          problem:       (fd.get("problem")       || "").toString().trim(),
          target_users:  (fd.get("target_users")  || "").toString().trim(),
          constraints:   (fd.get("constraints")   || "").toString().trim(),
          region:        (fd.get("region")        || "Global").toString().trim()
        };
      }

      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        status.textContent = "";
        if (!form.reportValidity()) return;

        const body = { journey_type: "idea", payload: payloadFromForm(form) };
        const oldTxt = btn.textContent;
        btn.disabled = true; btn.textContent = "Submitting…";

        try {
          const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);

          // Navigate to processing page with job id
          window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}`;
        } catch (err) {
          status.textContent = "Submit failed. Check ngrok URL and that the backend is running.";
          alert(err.message);
          btn.disabled = false; btn.textContent = oldTxt;
        }
      });
    })();
  </script>
</body>
</html>
