<script>
  // ==== CONFIG: set to your current ngrok https URL ====
  const NEXTIFY_API_BASE = "https://2b14bd5555af.ngrok-free.app";

  // Optional connectivity check (no UI changes)
  (async () => {
    try { await fetch(`${NEXTIFY_API_BASE}/`, { cache: "no-store" }); }
    catch (e) { console.warn("API not reachable:", e); }
  })();

  // Attach submit handler to your existing form (by id or use document.forms[0])
  (function () {
    // If your form has an id, set it here. Otherwise the first form is used.
    const form = document.getElementById("idea-form") || document.forms[0];
    if (!form) return console.error("Idea form not found.");

    form.addEventListener("submit", async (ev) => {
      // If your original form already posts somewhere, remove that action to avoid double navigation.
      ev.preventDefault();

      // Read fields by their existing name attributes (keep your current names!)
      const fd = new FormData(form);

      const payload = {
        idea_title:    (fd.get("idea_title")    || "").toString().trim(),
        current_stage: (fd.get("current_stage") || "").toString().trim(),
        problem:       (fd.get("problem")       || "").toString().trim(),
        target_users:  (fd.get("target_users")  || "").toString().trim(),
        constraints:   (fd.get("constraints")   || "").toString().trim(),
        region:        (fd.get("region")        || "Global").toString().trim()
      };

      // Build the body exactly as backend expects
      const body = { journey_type: "idea", payload };

      // Optional: show lightweight busy state (no CSS changes)
      const submitBtn = form.querySelector('[type="submit"]');
      const oldTxt = submitBtn ? submitBtn.textContent : "";
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Submitting…"; }

      try {
        const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);

        // Navigate to your existing processing page (unchanged)
        window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}`;
      } catch (err) {
        alert("Submit failed. Please check the API URL / ngrok / CORS.\n\n" + err.message);
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = oldTxt; }
      }
    }, { passive: false });
  })();
</script>
