<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nextify – Idea</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Top bar -->
  <header class="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-gray-100">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-lg font-semibold text-blue-700">Nextify</a>
      <a href="roles-founder.html" class="text-sm text-gray-600 hover:text-gray-800">← Back</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-10">
    <div class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">Start with your Idea</h1>
      <p class="text-gray-600 mt-2">Tell us your idea, we’ll generate a structured innovation report.</p>
    </div>

    <form id="idea-form" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 space-y-6">

      <!-- API (ngrok) URL — compact, lives at the top and remembers itself -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-3">
          <label for="api_base" class="block text-xs font-medium text-gray-700 mb-1">
            API base (ngrok HTTPS url) <span class="text-red-500">*</span>
          </label>
          <div class="flex gap-2">
            <input id="api_base" name="api_base" type="url" required
                   placeholder="https://xxxxx.ngrok-free.app"
                   class="block w-full rounded-xl border border-gray-300 bg-white px-3 py-2 text-gray-900 shadow-sm
                          focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600" />
            <button type="button" id="checkApi"
                    class="rounded-xl border border-gray-300 px-3 py-2 text-gray-700 hover:bg-gray-50">
              Check
            </button>
          </div>
          <p id="apiHint" class="text-xs text-gray-500 mt-1">
            Paste the current <b>https</b> ngrok URL that forwards to your FastAPI (port 8000). We remember it for you.
          </p>
        </div>
      </div>

      <!-- Main fields -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Idea title -->
        <div class="md:col-span-2">
          <label for="idea_title" class="block text-sm font-medium text-gray-800 mb-1">
            Idea title <span class="text-red-500">*</span>
          </label>
          <input id="idea_title" name="idea_title" type="text" required
                 placeholder="e.g., Global Innovation Platform"
                 class="block w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-gray-900 shadow-sm
                        focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600" />
        </div>

        <!-- Current stage -->
        <div>
          <label for="current_stage" class="block text-sm font-medium text-gray-800 mb-1">
            Current stage <span class="text-red-500">*</span>
          </label>
          <select id="current_stage" name="current_stage" required
                  class="block w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-gray-900 shadow-sm
                         focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
            <option value="">Choose a stage…</option>
            <option>Idea only</option>
            <option>Prototype</option>
            <option>MVP</option>
            <option>Growth</option>
          </select>
        </div>

        <!-- Location / Region -->
        <div>
          <label for="region" class="block text-sm font-medium text-gray-800 mb-1">
            Location / Region <span class="text-red-500">*</span>
          </label>
          <input id="region" name="region" type="text" required
                 placeholder="e.g., Berlin; Global; North America"
                 class="block w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-gray-900 shadow-sm
                        focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600" />
        </div>

        <!-- Problem -->
        <div class="md:col-span-2">
          <label for="problem" class="block text-sm font-medium text-gray-800 mb-1">
            What problem does it solve? <span class="text-red-500">*</span>
          </label>
          <textarea id="problem" name="problem" rows="5" required
                    placeholder="e.g., Founders and accelerators struggle to discover one another globally; discovery and collaboration are fragmented."
                    class="block w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-gray-900 shadow-sm
                           focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600"></textarea>
        </div>

        <!-- Target users -->
        <div class="md:col-span-2">
          <label for="target_users" class="block text-sm font-medium text-gray-800 mb-1">
            Who is it for? <span class="text-red-500">*</span>
          </label>
          <input id="target_users" name="target_users" type="text" required
                 placeholder="e.g., Accelerators; Founders; Investors; Kids; Educators"
                 class="block w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-gray-900 shadow-sm
                        focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600" />
        </div>

        <!-- Constraints -->
        <div class="md:col-span-2">
          <label for="constraints" class="block text-sm font-medium text-gray-800 mb-1">
            Constraints (optional)
          </label>
          <textarea id="constraints" name="constraints" rows="3"
                    placeholder="e.g., Solo founder; limited budget; need design help"
                    class="block w-full rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-gray-900 shadow-sm
                           focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600"></textarea>
          <p class="text-xs text-gray-500 mt-1">Add anything that may affect scope, timeline, or feasibility.</p>
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex items-center gap-3 pt-2">
        <a href="roles-founder.html"
           class="inline-flex items-center justify-center rounded-xl border border-gray-300 px-4 py-2.5 text-gray-700 hover:bg-gray-50">
           Cancel
        </a>
        <button type="submit"
                class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-2.5 text-white hover:bg-blue-700
                       disabled:opacity-50 disabled:cursor-not-allowed">
          Continue
        </button>
      </div>
    </form>
  </main>

  <script>
  (function () {
    // 1) Prefill API field from localStorage or ?api= override
    const apiInput = document.getElementById("api_base");

    const urlApi = new URLSearchParams(location.search).get("api");
    const savedApi = localStorage.getItem("NEXTIFY_API_BASE") || "";
    if (urlApi && /^https:\/\/.+/.test(urlApi)) {
      apiInput.value = urlApi.trim();
      localStorage.setItem("NEXTIFY_API_BASE", urlApi.trim());
    } else if (savedApi) {
      apiInput.value = savedApi;
    }

    // "Check" button: quick connectivity smoke test
    document.getElementById("checkApi").addEventListener("click", async () => {
      const base = (apiInput.value || "").trim();
      if (!/^https:\/\/.+/.test(base)) {
        alert("Please paste a valid HTTPS ngrok URL."); return;
      }
      try {
        const r = await fetch(base + "/", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        localStorage.setItem("NEXTIFY_API_BASE", base);
        alert("API reachable ✅");
      } catch (e) {
        alert("API not reachable ❌\n\n" + e.message);
      }
    });

    // 2) Submit flow → POST to FastAPI, then redirect to processing
    const form = document.getElementById("idea-form");
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();

      const apiBase = (apiInput.value || "").trim();
      if (!/^https:\/\/.+/.test(apiBase)) {
        alert("Please paste your HTTPS ngrok URL in the API field."); return;
      }
      localStorage.setItem("NEXTIFY_API_BASE", apiBase);

      const fd = new FormData(form);
      const payload = {
        idea_title:    (fd.get("idea_title")    || "").toString().trim(),
        current_stage: (fd.get("current_stage") || "").toString().trim(),
        region:        (fd.get("region")        || "").toString().trim(),
        problem:       (fd.get("problem")       || "").toString().trim(),
        target_users:  (fd.get("target_users")  || "").toString().trim(),
        constraints:   (fd.get("constraints")   || "").toString().trim(),
      };

      const body = { journey_type: "idea", payload };

      const btn = form.querySelector('button[type="submit"]');
      const oldTxt = btn.textContent;
      btn.disabled = true; btn.textContent = "Submitting…";

      try {
        const resp = await fetch(`${apiBase}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);

        // carry api along so processing page can read it, too
        window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}&api=${encodeURIComponent(apiBase)}`;
      } catch (err) {
        alert("Submit failed. Please check API/ngrok.\n\n" + err.message);
        btn.disabled = false; btn.textContent = oldTxt;
      }
    });
  })();
  </script>
</body>
</html>
