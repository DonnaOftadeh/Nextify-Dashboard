<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nextify – Idea</title>

  <!-- ✅ Tailwind CDN so the page looks like your other forms -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Optional: light container width like your other pages -->
  <style>
    .form-label { @apply block text-sm font-medium text-gray-700 mb-1; }
    .form-input { @apply block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900
                         focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500; }
    .hint { @apply text-sm text-gray-500; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="border-b bg-white">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-semibold text-blue-700">Nextify</a>
      <a href="roles-founder.html" class="text-sm text-gray-500 hover:text-gray-700">← Back</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold tracking-tight text-gray-900 mb-2">Start with your Idea</h1>
    <p class="text-gray-600 mb-8">Tell us your idea, we’ll generate a structured innovation report.</p>

    <!-- ✅ Keep your form UX; only classes/styles added -->
    <form id="idea-form" class="space-y-6">
      <div>
        <label for="idea_title" class="form-label">Idea title <span class="text-red-500">*</span></label>
        <input id="idea_title" name="idea_title" type="text" required class="form-input"
               placeholder="e.g., Global Innovation Platform" />
      </div>

      <div>
        <label for="current_stage" class="form-label">Current stage <span class="text-red-500">*</span></label>
        <select id="current_stage" name="current_stage" required class="form-input">
          <option value="">Choose a stage…</option>
          <option>Idea only</option>
          <option>Prototype</option>
          <option>MVP</option>
          <option>Growth</option>
        </select>
      </div>

      <div>
        <label for="problem" class="form-label">What problem does it solve? <span class="text-red-500">*</span></label>
        <textarea id="problem" name="problem" required class="form-input" rows="4"
          placeholder="e.g., Founders can’t easily connect with global investors; discovery is fragmented"></textarea>
      </div>

      <div>
        <label for="target_users" class="form-label">Who is it for? <span class="text-red-500">*</span></label>
        <input id="target_users" name="target_users" type="text" required class="form-input"
               placeholder="e.g., Accelerators; Founders; Investors; Kids; Educators" />
      </div>

      <div>
        <label for="constraints" class="form-label">Constraints (optional)</label>
        <textarea id="constraints" name="constraints" class="form-input" rows="3"
          placeholder="e.g., Solo founder, limited budget, need design help"></textarea>
        <p class="hint mt-1">Add anything that may affect scope/timeline.</p>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <a href="roles-founder.html" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">Cancel</a>
        <button type="submit" class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Continue</button>
      </div>
    </form>
  </main>

  <!-- ✅ Backend wiring; no UX changes -->
  <script>
  (function () {
    let NEXTIFY_API_BASE = localStorage.getItem("NEXTIFY_API_BASE") || "";
    if (!/^https:\/\/.+/.test(NEXTIFY_API_BASE)) {
      const v = prompt("Enter your API base (ngrok https URL):", "https://xxxxx.ngrok-free.app");
      if (v && /^https:\/\/.+/.test(v.trim())) {
        NEXTIFY_API_BASE = v.trim();
        localStorage.setItem("NEXTIFY_API_BASE", NEXTIFY_API_BASE);
      }
    }

    const form = document.getElementById("idea-form");
    if (!form) return;

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();

      // Serialize all existing fields without renaming
      const fd = new FormData(form);
      const payload = {};
      for (const [k, v] of fd.entries()) payload[k] = (v ?? "").toString().trim();
      if (!("region" in payload)) payload.region = "Global"; // default

      const body = { journey_type: "idea", payload };

      const btn = form.querySelector('[type="submit"]');
      const oldTxt = btn.textContent;
      btn.disabled = true; btn.textContent = "Submitting…";

      try {
        const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
        window.location.href = `founder-processing.html?job=${encodeURIComponent(data.job_id)}`;
      } catch (err) {
        alert("Submit failed. Check API/ngrok.\n\n" + err.message);
        btn.disabled = false; btn.textContent = oldTxt;
      }
    });
  })();
  </script>
</body>
</html>
