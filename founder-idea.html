<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nextify – Idea</title>
  <!-- Tailwind (same look as your other pages) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* keep your visual style; only make required asterisks red */
    .req::after { content:" *"; color:#dc2626; }
  </style>
</head>
<body class="h-full bg-white text-slate-900">
  <main class="mx-auto max-w-5xl px-6 py-10">
    <header class="mb-8">
      <a href="roles-founder.html" class="text-slate-500 hover:text-slate-700">&larr; Back</a>
      <h1 class="mt-4 text-4xl font-semibold">Start with your Idea</h1>
      <p class="mt-2 text-slate-600">Tell us your idea; we’ll generate a structured innovation report.</p>
      <div id="apiBadge" class="mt-3 hidden rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">
        API: Not reachable
      </div>
    </header>

    <form id="idea-form" class="space-y-8">
      <!-- Idea title -->
      <div>
        <label for="idea_title" class="req block text-base font-medium text-slate-800">Idea title</label>
        <input id="idea_title" name="idea_title" type="text"
               placeholder="e.g., Global Innovation Platform"
               class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 shadow-sm focus:border-blue-500 focus:ring-blue-500" required />
      </div>

      <!-- Stage + Region in two columns (md+) -->
      <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
        <div>
          <label for="current_stage" class="req block text-base font-medium text-slate-800">Current stage</label>
          <select id="current_stage" name="current_stage"
                  class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
            <option value="" selected>Choose a stage…</option>
            <option value="Idea">Idea</option>
            <option value="Prototype">Prototype</option>
            <option value="MVP">MVP</option>
            <option value="In-market">In-market</option>
          </select>
        </div>

        <div>
          <label for="region" class="block text-base font-medium text-slate-800">Region</label>
          <input id="region" name="region" type="text" value="Global"
                 class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 shadow-sm focus:border-blue-500 focus:ring-blue-500" />
          <!-- add a bit of air above this hint (your request) -->
          <p class="mt-2 text-sm text-slate-500">
            Default is Global; you can specify e.g., Berlin, EU, US-East.
          </p>
        </div>
      </div>

      <!-- Problem -->
      <div>
        <label for="problem" class="req block text-base font-medium text-slate-800">What problem does it solve?</label>
        <textarea id="problem" name="problem" rows="4"
                  placeholder="e.g., Founders and accelerators struggle to discover one another globally; discovery and collaboration are fragmented."
                  class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 shadow-sm focus:border-blue-500 focus:ring-blue-500" required></textarea>
      </div>

      <!-- Target users -->
      <div>
        <label for="target_users" class="req block text-base font-medium text-slate-800">Who is it for?</label>
        <input id="target_users" name="target_users" type="text"
               placeholder="e.g., Accelerators; Founders; Investors; Kids; Educators"
               class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 shadow-sm focus:border-blue-500 focus:ring-blue-500" required />
      </div>

      <!-- Constraints -->
      <div>
        <label for="constraints" class="block text-base font-medium text-slate-800">Constraints (optional)</label>
        <textarea id="constraints" name="constraints" rows="3"
                  class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-3 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
      </div>

      <div class="pt-2">
        <button id="submitBtn" type="submit"
                class="rounded-lg bg-blue-600 px-5 py-3 text-white shadow hover:bg-blue-700 focus:outline-none">
          Continue
        </button>
      </div>
    </form>
  </main>

  <script>
    // ====== SET THIS if your ngrok URL rotates later ======
    const NEXTIFY_API_BASE ="https://gilbert-unbridged-rumbly.ngrok-free.app";
    // ======================================================

    // Tiny connectivity check
    (async () => {
      try {
        const r = await fetch(`${NEXTIFY_API_BASE}/`, { cache: "no-store" });
        const ok = r.ok && (await r.json()).ok;
        if (!ok) document.getElementById("apiBadge").classList.remove("hidden");
      } catch {
        document.getElementById("apiBadge").classList.remove("hidden");
      }
    })();

    document.getElementById("idea-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();

      const fd = new FormData(ev.currentTarget);
      const payload = {
        idea_title:    (fd.get("idea_title")    || "").toString().trim(),
        current_stage: (fd.get("current_stage") || "").toString().trim(),
        problem:       (fd.get("problem")       || "").toString().trim(),
        target_users:  (fd.get("target_users")  || "").toString().trim(),
        constraints:   (fd.get("constraints")   || "").toString().trim(),
        region:        (fd.get("region")        || "Global").toString().trim(),
      };

      // Basic required fields (browser also enforces)
      if (!payload.idea_title || !payload.current_stage || !payload.problem || !payload.target_users) {
        alert("Please complete the required fields.");
        return;
      }

      const body = { journey_type: "idea", payload };

      const btn = document.getElementById("submitBtn");
      const old = btn.textContent;
      btn.disabled = true; btn.textContent = "Submitting…";

      try {
        const resp = await fetch(`${NEXTIFY_API_BASE}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        const ct = resp.headers.get("content-type") || "";
        if (!ct.includes("application/json")) {
          throw new Error(`Submit did not return JSON (got ${ct}). Check ngrok URL / FastAPI.`);
        }

        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);

        const job = data.job_id;
        if (!job) throw new Error("No job_id returned.");

        // Go to processing page WITH the job id
        window.location.href = `founder-processing.html?job=${encodeURIComponent(job)}`;
      } catch (e) {
        alert("Submit failed. " + e.message);
        btn.disabled = false; btn.textContent = old;
      }
    });
  </script>
</body>
</html>
