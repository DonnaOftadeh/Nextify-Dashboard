<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Nextify – Set API URL</title>
<style>
  body{font-family:system-ui,Segoe UI,Inter,Arial,sans-serif;margin:40px;line-height:1.45;color:#111}
  code{background:#f3f4f6;padding:2px 6px;border-radius:6px}
  input{padding:8px 10px;width:360px;border:1px solid #cbd5e1;border-radius:8px}
  button{padding:9px 14px;border-radius:999px;border:1px solid #0ea5e9;background:#0ea5e9;color:#fff;font-weight:600;cursor:pointer}
</style>
<h1>Set Nextify API URL</h1>
<p>This stores your current backend URL in <code>localStorage</code> so all pages use it.</p>
<script>
  (function(){
    const p = new URLSearchParams(location.search);
    const url = (p.get("url")||"").trim();
    if (url.startsWith("https://")) {
      localStorage.setItem("NEXTIFY_API_BASE", url);
      document.body.insertAdjacentHTML("beforeend",
        `<p>Saved API base: <code>${url}</code></p><p><a href="roles-founder.html">Back to start</a></p>`);
    } else {
      document.body.insertAdjacentHTML("beforeend",
        `<p><b>No <code>?url=</code> provided.</b> Paste your current tunnel here:</p>
         <form onsubmit="localStorage.setItem('NEXTIFY_API_BASE', this.url.value.trim()); location.href='roles-founder.html'; return false;">
           <input name="url" required placeholder="https://xxxx.ngrok-free.app"/>
           <button type="submit">Save</button>
         </form>`);
    }
  })();
</script>
