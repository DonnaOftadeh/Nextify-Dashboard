<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nextify — Processing</title>
  <!-- Keep your existing CSS links here if you have them -->
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#fff; color:#111; }
    .topbar { padding:18px 0; border-bottom:1px solid #eee; }
    .brand { color:#2563eb; font-weight:800; font-size:22px; letter-spacing:.2px; }
    .container { max-width: 1040px; margin: 0 auto; padding: 24px; }
    h1 { margin:0 0 8px; }
    .row { margin: 8px 0; }
    #barOuter { width:100%; background:#eee; height:20px; border-radius:10px; overflow:hidden; margin-top: 6px; }
    #progressBar { height:20px; width:0%; background:#2563eb; transition: width .25s ease; }
    #downloadBtn { margin-top: 16px; background:#2563eb; color:#fff; border:none; padding:12px 18px; border-radius:10px; font-size:16px; cursor:pointer; }
    #downloadBtn[disabled]{ opacity:.6; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container"><span class="brand">Nextify</span></div>
  </div>

  <div class="container">
    <h1>Running your analysis</h1>

    <div class="row">Status: <strong id="statusText">—</strong></div>
    <div class="row">Step: <strong id="stepText">—</strong></div>

    <div id="barOuter"><div id="progressBar"></div></div>
    <div class="row"><span id="pct">0%</span></div>

    <button id="downloadBtn" disabled>Download report</button>
  </div>

  <script>
  (async function () {
    // Stable ngrok URL (custom domain you shared)
    const NEXTIFY_API_BASE = "https://gilbert-unbridged-rumbly.ngrok-free.app";

    const params = new URLSearchParams(location.search);
    const job = params.get("job");
    if (!job) { alert("No job id in URL."); return; }

    const progressBar = document.getElementById("progressBar");
    const statusText  = document.getElementById("statusText");
    const stepText    = document.getElementById("stepText");
    const pctText     = document.getElementById("pct");
    const downloadBtn = document.getElementById("downloadBtn");

    function setPct(n) {
      const p = Math.max(0, Math.min(100, parseInt(n || 0, 10)));
      progressBar.style.width = p + "%";
      pctText.textContent = p + "%";
    }

    try {
      while (true) {
        const r = await fetch(`${NEXTIFY_API_BASE}/api/status/${encodeURIComponent(job)}`, { cache: "no-store" });
        const s = await r.json();
        if (!r.ok) throw new Error(s.detail || `HTTP ${r.status}`);

        setPct(s.progress);
        statusText.textContent = s.status || "";
        stepText.textContent   = s.step   || "";

        if (s.status === "failed") {
          downloadBtn.disabled = true;
          downloadBtn.textContent = "Run failed";
          alert("Pipeline failed: " + (s.message || "Unknown error"));
          break;
        }

        if (s.ready) {
          const pdfURL = `${NEXTIFY_API_BASE}/api/result/${encodeURIComponent(job)}`;
          downloadBtn.disabled = false;
          downloadBtn.textContent = "Download report";
          downloadBtn.onclick = () => { window.location.href = pdfURL; };
          break;
        }

        await new Promise(res => setTimeout(res, 1200));
      }
    } catch (e) {
      alert("Cannot reach backend. Check ngrok and FastAPI are running.\n\n" + e.message);
    }
  })();
  </script>
</body>
</html>
