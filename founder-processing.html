<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Founder – Processing</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #barOuter { width: 100%; background: #eee; height: 20px; border-radius: 4px; margin-top: 1em; }
    #progressBar { height: 20px; width: 0%; background: #4caf50; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Processing Your Report…</h1>

  <p>Status: <span id="statusText">Starting…</span></p>
  <p>Step: <span id="stepText">Queued</span></p>
  <div id="barOuter"><div id="progressBar"></div></div>
  <p><span id="pct">0%</span></p>

  <button id="downloadBtn" disabled>Download report</button>

  <script>
  (async function () {
    let NEXTIFY_API_BASE = localStorage.getItem("NEXTIFY_API_BASE") || "";
    if (!NEXTIFY_API_BASE || !/^https:\/\/.+/.test(NEXTIFY_API_BASE)) {
      const v = prompt("Enter your API base (ngrok https URL):", "https://xxxx.ngrok-free.app");
      if (v && /^https:\/\/.+/.test(v.trim())) {
        NEXTIFY_API_BASE = v.trim();
        localStorage.setItem("NEXTIFY_API_BASE", NEXTIFY_API_BASE);
      } else return;
    }

    const q = new URLSearchParams(location.search);
    const job = q.get("job");
    if (!job) { alert("No job id."); return; }

    const progressBar = document.getElementById("progressBar");
    const statusText  = document.getElementById("statusText");
    const stepText    = document.getElementById("stepText");
    const pctText     = document.getElementById("pct");
    const downloadBtn = document.getElementById("downloadBtn");

    function setPct(n) {
      const p = Math.max(0, Math.min(100, parseInt(n || 0, 10)));
      progressBar.style.width = p + "%";
      pctText.textContent = p + "%";
    }

    while (true) {
      const r = await fetch(`${NEXTIFY_API_BASE}/api/status/${encodeURIComponent(job)}`, { cache: "no-store" });
      const s = await r.json();

      setPct(s.progress);
      statusText.textContent = s.status || "";
      stepText.textContent   = s.step   || "";

      if (s.status === "failed") {
        downloadBtn.disabled = true;
        downloadBtn.textContent = "Run failed";
        alert("Pipeline failed: " + (s.message || ""));
        break;
      }

      if (s.ready) {
        const pdfURL = `${NEXTIFY_API_BASE}/api/result/${encodeURIComponent(job)}`;
        downloadBtn.disabled = false;
        downloadBtn.textContent = "Download report";
        downloadBtn.onclick = () => { window.location.href = pdfURL; };
        break;
      }

      await new Promise(res => setTimeout(res, 1200));
    }
  })();
  </script>
</body>
</html>
