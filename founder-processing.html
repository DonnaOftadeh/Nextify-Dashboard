<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nextify • Processing</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="p-4 border-b bg-white">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-xl font-bold text-blue-600">Nextify</h1>
    </div>
  </header>

  <main class="flex-grow p-6 max-w-2xl mx-auto text-center">
    <h2 class="text-2xl font-bold mb-4">Processing your Idea</h2>
    <p class="text-gray-600 mb-6">Our agents are working on your submission. This may take a few moments.</p>
    <div id="status" class="mb-4 text-gray-700">Initializing…</div>
    <div class="w-full bg-gray-200 rounded-full h-3">
      <div id="progress-bar" class="bg-blue-600 h-3 rounded-full" style="width: 5%"></div>
    </div>
    <button id="download-btn" class="mt-6 py-2 px-4 bg-green-600 text-white rounded-md hover:bg-green-700 hidden">Download PDF</button>
  </main>

  <script>
    const NEXTIFY_API_BASE = "https://gilbert-unbridged-rumbly.ngrok-free.app";
    const NGROK_PARAM = "ngrok-skip-browser-warning=true";
    const api = (path) => {
      const sep = path.includes("?") ? "&" : "?";
      return `${NEXTIFY_API_BASE}${path}${sep}${NGROK_PARAM}`;
    };

    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get("job_id");
    const journey = urlParams.get("journey");

    const statusEl = document.getElementById("status");
    const progressBar = document.getElementById("progress-bar");
    const downloadBtn = document.getElementById("download-btn");

    async function pollStatus() {
      try {
        const r = await fetch(api(`/api/job/${jobId}`));
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Polling failed");

        statusEl.textContent = `Status: ${data.status}`;
        progressBar.style.width = `${data.progress || 0}%`;

        if (data.status === "completed") {
          downloadBtn.classList.remove("hidden");
          downloadBtn.onclick = () => {
            window.open(api(`/api/download/${jobId}`), "_blank");
          };
          return; // stop polling
        }
      } catch (e) {
        console.error("Polling error:", e);
        statusEl.textContent = "Error communicating with server.";
      }
      setTimeout(pollStatus, 2000);
    }

    pollStatus();
  </script>
</body>
</html>
