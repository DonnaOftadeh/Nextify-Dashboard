<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nextify – Processing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-white text-slate-900">
  <main class="mx-auto max-w-4xl px-6 py-10">
    <header class="mb-6">
      <a href="roles-founder.html" class="text-slate-500 hover:text-slate-700">&larr; Back</a>
      <h1 class="mt-4 text-4xl font-semibold">Running your analysis</h1>
      <p id="jobInfo" class="mt-1 text-slate-500">No job id</p>
    </header>

    <section class="space-y-3">
      <div class="text-slate-700">
        <div><span class="font-semibold">Status:</span> <span id="stat">—</span></div>
        <div><span class="font-semibold">Step:</span> <span id="step">—</span></div>
      </div>

      <div class="h-3 w-full rounded bg-slate-200">
        <div id="bar" class="h-3 rounded bg-blue-500" style="width:0%"></div>
      </div>
      <div id="pct" class="text-sm text-slate-500">0%</div>

      <div class="pt-6">
        <button id="dlBtn" disabled
                class="rounded-lg bg-blue-600 px-5 py-3 text-white shadow disabled:opacity-40">
          Download report
        </button>
      </div>

      <pre id="err" class="whitespace-pre-wrap text-sm text-red-600"></pre>
    </section>
  </main>

  <script>
    // ====== SET THIS if your ngrok URL rotates later ======
    const NEXTIFY_API_BASE ="https://gilbert-unbridged-rumbly.ngrok-free.app";
    // ======================================================

    const qs = new URLSearchParams(window.location.search);
    const job = qs.get("job") || "";
    document.getElementById("jobInfo").textContent = job ? `Job: ${job}` : "No job id";

    const stat = document.getElementById("stat");
    const step = document.getElementById("step");
    const bar  = document.getElementById("bar");
    const pct  = document.getElementById("pct");
    const err  = document.getElementById("err");
    const dlBtn= document.getElementById("dlBtn");

    function setProgress(p) {
      const v = Math.max(0, Math.min(100, Number(p) || 0));
      bar.style.width = `${v}%`;
      pct.textContent = `${v}%`;
    }

    async function poll() {
      if (!job) {
        err.textContent = "Missing job id in the URL. Go back and submit the form again.";
        return;
      }

      // quick ping to ensure we’re talking to FastAPI (not HTML)
      try {
        const ping = await fetch(`${NEXTIFY_API_BASE}/`, { cache: "no-store" });
        const ct   = ping.headers.get("content-type") || "";
        if (!ct.includes("application/json")) {
          throw new Error(`Backend did not return JSON at '/'. Got ${ct}. Check ngrok URL.`);
        }
      } catch (e) {
        err.textContent = e.message;
        return;
      }

      let done = false;
      while (!done) {
        try {
          const r = await fetch(`${NEXTIFY_API_BASE}/api/status/${encodeURIComponent(job)}`, { cache: "no-store" });
          const ct = r.headers.get("content-type") || "";

          // HARD guard: stop if someone returns HTML (this was your error)
          if (!ct.includes("application/json")) {
            const text = await r.text();
            throw new Error(`Expected JSON but got ${ct}. First bytes: ${text.slice(0, 120)}`);
          }

          const s = await r.json();
          stat.textContent = s.status ?? "—";
          step.textContent = s.step ?? "—";
          setProgress(s.progress ?? 0);

          if (s.status === "failed") {
            err.textContent = s.message || "Pipeline failed.";
            return;
          }
          if (s.ready || s.status === "done") {
            done = true;
            dlBtn.disabled = false;
            dlBtn.onclick = () => {
              window.location.href = `${NEXTIFY_API_BASE}/api/result/${encodeURIComponent(job)}`;
            };
            return;
          }
        } catch (e) {
          err.textContent = `Cannot reach backend. ${e.message}`;
          return;
        }
        await new Promise(res => setTimeout(res, 1000));
      }
    }

    poll();
  </script>
</body>
</html>
