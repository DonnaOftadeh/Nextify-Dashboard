<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nextify – Processing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-3xl mx-auto py-8 px-4">
    <a href="roles-founder.html" class="text-sm text-gray-500">&larr; Back</a>
    <h1 class="text-3xl font-bold mb-4">Running your analysis</h1>

    <div id="apiBadge" class="hidden bg-red-100 text-red-700 px-3 py-2 rounded mb-4">
      API: Not reachable
    </div>

    <p>Status: <span id="status">—</span></p>
    <p>Step: <span id="step">—</span></p>

    <div class="w-full bg-gray-200 rounded h-4 mt-2">
      <div id="bar" class="bg-blue-600 h-4 rounded text-xs text-white text-center" style="width:0%">0%</div>
    </div>

    <button id="downloadBtn" disabled
            class="mt-6 bg-blue-600 text-white px-5 py-2 rounded font-medium hover:bg-blue-700 disabled:opacity-50">
      Download report
    </button>
  </div>

  <script>
    const NEXTIFY_API_BASE = "https://gilbert-unbridged-rumbly.ngrok-free.app";

    // --- API health check like in founder-idea ---
    async function checkApi() {
      const badge = document.getElementById("apiBadge");
      try {
        const r = await fetch(`${NEXTIFY_API_BASE}/`, {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          credentials: "omit",
          headers: { "Accept": "application/json" }
        });
        const ct = (r.headers.get("content-type") || "").toLowerCase();
        if (!r.ok || !ct.includes("application/json")) {
          badge.classList.remove("hidden");
          return;
        }
        const data = await r.json();
        if (!data || data.ok !== true) badge.classList.remove("hidden");
      } catch (e) {
        badge.classList.remove("hidden");
      }
    }
    checkApi();

    // --- Poll job status ---
    const params = new URLSearchParams(window.location.search);
    const job = params.get("job");

    async function poll() {
      if (!job) return;
      try {
        const r = await fetch(`${NEXTIFY_API_BASE}/api/status/${job}`, { cache: "no-store" });
        const s = await r.json();
        document.getElementById("status").textContent = s.status || "—";
        document.getElementById("step").textContent = s.step || "—";
        const bar = document.getElementById("bar");
        const pct = s.progress || 0;
        bar.style.width = pct + "%";
        bar.textContent = pct + "%";

        if (s.ready) {
          const btn = document.getElementById("downloadBtn");
          btn.disabled = false;
          btn.onclick = () => window.open(`${NEXTIFY_API_BASE}/api/download/${job}`, "_blank");
          return;
        }
        setTimeout(poll, 1500);
      } catch (e) {
        console.error("Polling error:", e);
        setTimeout(poll, 3000);
      }
    }
    poll();
  </script>
</body>
</html>
