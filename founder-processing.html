<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nextify – Processing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-gray-100">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-lg font-semibold text-blue-700">Nextify</a>
      <a href="roles-founder.html" class="text-sm text-gray-600 hover:text-gray-800">← Back</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-10">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
      <h1 class="text-2xl font-semibold text-gray-900 mb-2">Generating your report…</h1>
      <p class="text-gray-600 mb-6">This usually takes under a minute.</p>

      <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden mb-3">
        <div id="bar" class="h-3 bg-blue-600 transition-all" style="width:0%"></div>
      </div>
      <div class="flex items-center justify-between text-sm text-gray-600">
        <div><span id="pct">0</span>%</div>
        <div id="status">Queued</div>
      </div>
      <div class="mt-2 text-sm text-gray-700">Step: <span id="step">—</span></div>

      <div class="mt-8 flex items-center gap-3">
        <button id="downloadBtn" disabled
                class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-2.5 text-white disabled:opacity-40">
          Download PDF
        </button>
        <a id="rawBtn" href="#" target="_blank" class="text-sm text-gray-600 hover:underline">View raw output</a>
      </div>
    </div>
  </main>

  <script>
  (function () {
    const qs = new URLSearchParams(location.search);
    const jobId = qs.get("job");
    let API_BASE = qs.get("api") || localStorage.getItem("NEXTIFY_API_BASE") || "";

    if (!jobId) { alert("Missing job id"); return; }
    if (!/^https:\/\/.+/.test(API_BASE)) {
      const v = prompt("Enter API base (https):", "https://xxxxx.ngrok-free.app");
      if (!v || !/^https:\/\/.+/.test(v.trim())) return alert("Need a valid HTTPS URL.");
      API_BASE = v.trim();
      localStorage.setItem("NEXTIFY_API_BASE", API_BASE);
    }

    const statusEl = document.getElementById("status");
    const stepEl = document.getElementById("step");
    const barEl = document.getElementById("bar");
    const pctEl = document.getElementById("pct");
    const dlBtn = document.getElementById("downloadBtn");
    const rawBtn = document.getElementById("rawBtn");
    rawBtn.href = `${API_BASE}/api/debug/${encodeURIComponent(jobId)}/raw`;

    async function poll() {
      try {
        const r = await fetch(`${API_BASE}/api/status/${encodeURIComponent(jobId)}`, { cache: "no-store" });
        const s = await r.json();
        statusEl.textContent = `${s.progress}% | ${s.status}`;
        stepEl.textContent = s.step || "";
        barEl.style.width = Math.max(0, Math.min(100, s.progress || 0)) + "%";
        pctEl.textContent = s.progress || 0;

        if (s.status === "failed") { alert("Pipeline failed: " + (s.message||"")); return; }
        if (s.ready) {
          dlBtn.disabled = false;
          dlBtn.onclick = async () => {
            try {
              const resp = await fetch(`${API_BASE}/api/result/${encodeURIComponent(jobId)}`);
              if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
              const blob = await resp.blob();
              const a = document.createElement("a");
              const cd = resp.headers.get("Content-Disposition")||"";
              const m = cd.match(/filename="?([^"]+)"?/i);
              a.download = m ? m[1] : `report_${jobId}.pdf`;
              a.href = URL.createObjectURL(blob);
              document.body.appendChild(a); a.click();
              URL.revokeObjectURL(a.href); a.remove();
            } catch (e) { alert("Download failed: " + e.message); }
          };
          return;
        }
      } catch (e) { console.warn("poll error:", e); }
      setTimeout(poll, 1200);
    }
    poll();
  })();
  </script>
</body>
</html>
