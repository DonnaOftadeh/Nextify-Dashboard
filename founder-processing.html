<script>
  // ==== CONFIG: same ngrok URL ====
  const NEXTIFY_API_BASE = "https://2b14bd5555af.ngrok-free.app";

  // Read ?job=... from URL
  const params = new URLSearchParams(location.search);
  const jobId = params.get("job");

  // Optionally map your existing elements (only if they exist in your page)
  // If you don't have these ids, remove these lines or add the ids in your HTML.
  const elProgress = document.getElementById("progressBar");     // width style only
  const elPct      = document.getElementById("pct");              // text like "42%"
  const elStatus   = document.getElementById("statusText");       // "running / done"
  const elStep     = document.getElementById("stepText");         // current step label
  const elBtn      = document.getElementById("downloadBtn");      // disabled until ready
  const elLog      = document.getElementById("log");              // optional textarea/div

  function setProgress(n){
    const p = Math.max(0, Math.min(100, parseInt(n || 0, 10)));
    if (elProgress) elProgress.style.width = `${p}%`;
    if (elPct)      elPct.textContent = `${p}%`;
  }
  function logLine(msg){
    if (!elLog) return;
    const t = new Date().toLocaleTimeString();
    elLog.insertAdjacentHTML("beforeend", `<div>${t} — ${msg}</div>`);
    elLog.scrollTop = elLog.scrollHeight;
  }

  async function poll(job) {
    if (!job) {
      console.warn("No job id in URL.");
      return;
    }
    while (true) {
      const r = await fetch(`${NEXTIFY_API_BASE}/api/status/${job}`, { cache: "no-store" });
      if (!r.ok) { logLine(`Status error ${r.status}`); break; }
      const s = await r.json();

      if (elStatus) elStatus.textContent = `Status: ${s.status}`;
      if (elStep)   elStep.textContent   = `Step: ${s.step}`;
      setProgress(s.progress);
      if (s.message) logLine(`${s.step}: ${s.message}`);

      if (s.status === "failed") {
        if (elBtn) {
          elBtn.disabled = true;
          elBtn.textContent = "Pipeline failed";
        }
        break;
      }

      if (s.ready) {
        if (elBtn) {
          elBtn.disabled = false;
          elBtn.textContent = "Download PDF";
          elBtn.addEventListener("click", () => {
            window.open(`${NEXTIFY_API_BASE}/api/result/${job}`, "_blank");
          }, { once: true });
        } else {
          // Fallback: auto open if you don't have a button
          window.open(`${NEXTIFY_API_BASE}/api/result/${job}`, "_blank");
        }
        break;
      }
      await new Promise(res => setTimeout(res, 1200));
    }
  }

  poll(jobId);
</script>
