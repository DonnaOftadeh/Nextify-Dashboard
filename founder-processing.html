<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nextify • Processing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse {0%,100%{opacity:1}50%{opacity:.6}}
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-16 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-blue-700">Nextify</a>
      <a href="roles-founder.html" class="text-sm text-gray-600 hover:text-blue-600">← Back</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900">Running your analysis</h1>
    <p id="jobTag" class="text-sm text-gray-600 mt-1">Job: —</p>

    <section class="mt-6 bg-white rounded-2xl shadow p-6">
      <div class="w-full bg-gray-100 rounded-full h-2">
        <div id="progressBar" class="h-2 bg-blue-600 rounded-full" style="width:0%"></div>
      </div>
      <div class="mt-4 flex justify-between">
        <div><div id="statusText" class="text-sm font-semibold">Status: —</div><div id="stepText" class="text-sm text-gray-600">Step: —</div></div>
        <div id="pct" class="text-xs text-gray-500">0%</div>
      </div>
      <div class="mt-6 space-y-3" id="stepsList"></div>

      <div class="mt-6">
        <h3 class="text-sm font-semibold text-gray-800">Activity</h3>
        <div id="log" class="mt-2 h-40 overflow-auto bg-gray-50 border border-gray-200 rounded-lg p-3 text-xs"></div>
      </div>

      <div class="mt-6">
        <button id="downloadBtn" class="px-5 py-2 rounded-full bg-gray-200 text-gray-600 cursor-not-allowed" disabled>
          Report not ready
        </button>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000"; // change for deployment
    const UI_STEPS = [
      "Parse Submission","Agent Orchestration","Howler Whisperer","The Marauder",
      "The Legilimens","The Seer","Room of Requirement (R1)","The Pensive (v1)",
      "The Headmaster","Room of Requirement (R2)","The Pensive (v2)",
      "The Sorting Hat","The Story Weaver","Write Report (PDF)"
    ];
    const job = new URLSearchParams(location.search).get("job");
    document.getElementById("jobTag").textContent = job ? `Job: ${job}` : "No job id";

    const stepsList = document.getElementById("stepsList");
    UI_STEPS.forEach((s,i)=>{const row=document.createElement("div");row.textContent=`${i+1}. ${s}`;row.id="row-"+s;stepsList.appendChild(row);});

    async function poll() {
      if (!job) return;
      while(true){
        const r=await fetch(`${API_BASE}/api/status/${job}`);const s=await r.json();
        document.getElementById("statusText").textContent=`Status: ${s.status}`;
        document.getElementById("stepText").textContent=`Step: ${s.step}`;
        document.getElementById("pct").textContent=`${s.progress}%`;
        document.getElementById("progressBar").style.width=`${s.progress}%`;
        if(s.message){document.getElementById("log").innerHTML+=`<div>${s.step}: ${s.message}</div>`;}
        if(s.ready){const btn=document.getElementById("downloadBtn");btn.disabled=false;btn.textContent="⬇️ Download PDF";btn.className="px-5 py-2 rounded-full bg-blue-600 text-white";btn.onclick=()=>window.open(`${API_BASE}/api/result/${job}`,"_blank");break;}
        if(s.status==="failed"){document.getElementById("downloadBtn").textContent="Failed";break;}
        await new Promise(res=>setTimeout(res,1500));
      }
    }
    poll();
  </script>
</body>
</html>
