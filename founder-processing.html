<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nextify • Processing</title>
  <script>
    // Use the same ngrok https URL:
    window.NEXTIFY_API_BASE = "https://2b14bd5555af.ngrok-free.app";
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-16 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-blue-700">Nextify</a>
      <div class="flex items-center gap-3">
        <span id="apiBadge" class="text-xs px-2 py-1 rounded bg-gray-100 text-gray-600">API: —</span>
        <a href="roles-founder.html" class="text-sm text-gray-600 hover:text-blue-600">← Back</a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900">Running your analysis</h1>
    <p id="jobTag" class="text-sm text-gray-600 mt-1">No job id</p>

    <section class="mt-6 bg-white rounded-2xl shadow p-6">
      <div class="w-full bg-gray-100 rounded-full h-2">
        <div id="progressBar" class="h-2 bg-blue-600 rounded-full" style="width:0%"></div>
      </div>
      <div class="mt-4 flex justify-between">
        <div>
          <div id="statusText" class="text-sm font-semibold">Status: —</div>
          <div id="stepText" class="text-sm text-gray-600">Step: —</div>
        </div>
        <div id="pct" class="text-xs text-gray-500">0%</div>
      </div>

      <div id="stepsList" class="mt-6 space-y-3"></div>

      <div class="mt-6">
        <h3 class="text-sm font-semibold text-gray-800">Activity</h3>
        <div id="log" class="mt-2 h-40 overflow-auto bg-gray-50 border border-gray-200 rounded-lg p-3 text-xs"></div>
      </div>

      <div class="mt-6">
        <button id="downloadBtn" class="px-5 py-2 rounded-full bg-gray-200 text-gray-600 cursor-not-allowed" disabled>
          Report not ready
        </button>
      </div>
    </section>
  </main>

  <script>
    const API = window.NEXTIFY_API_BASE;
    const UI_STEPS = [
      "Parse Submission","Agent Orchestration","Howler Whisperer","The Marauder",
      "The Legilimens","The Seer","Room of Requirement (R1)","The Pensive (v1)",
      "The Headmaster","Room of Requirement (R2)","The Pensive (v2)",
      "The Sorting Hat","The Story Weaver","Write Report (PDF)"
    ];

    const qs  = new URLSearchParams(location.search);
    const job = qs.get("job");
    const jobEl = document.getElementById("jobTag");
    jobEl.textContent = job ? `Job: ${job}` : "No job id";

    // connectivity badge
    (async () => {
      const badge = document.getElementById("apiBadge");
      try {
        const r = await fetch(`${API}/`, { cache:"no-store" });
        if (!r.ok) throw 0;
        badge.textContent = "API: Connected ✅";
        badge.className = "text-xs px-2 py-1 rounded bg-green-100 text-green-800";
      } catch {
        badge.textContent = "API: Not reachable ❌";
        badge.className = "text-xs px-2 py-1 rounded bg-rose-100 text-rose-700";
      }
    })();

    // render static steps
    const stepsList = document.getElementById("stepsList");
    UI_STEPS.forEach((s,i)=>{ const row=document.createElement("div"); row.id=`row-${i}`; row.textContent=`${i+1}. ${s}`; stepsList.appendChild(row); });

    function setProgress(n){
      const p = Math.max(0, Math.min(100, parseInt(n||0,10)));
      document.getElementById("progressBar").style.width = `${p}%`;
      document.getElementById("pct").textContent = `${p}%`;
    }
    function log(msg){
      const time=new Date().toLocaleTimeString();
      const el=document.getElementById("log");
      el.insertAdjacentHTML("beforeend", `<div>${time} — ${msg}</div>`);
      el.scrollTop = el.scrollHeight;
    }

    async function poll(jobId){
      if(!jobId) return;
      while(true){
        const r = await fetch(`${API}/api/status/${jobId}`, { cache:"no-store" });
        if(!r.ok){ log(`Status error: ${r.status}`); break; }
        const s = await r.json();
        document.getElementById("statusText").textContent = `Status: ${s.status}`;
        document.getElementById("stepText").textContent   = `Step: ${s.step}`;
        setProgress(s.progress);
        if(s.message) log(`${s.step}: ${s.message}`);

        if(s.status==="failed"){
          const btn=document.getElementById("downloadBtn");
          btn.textContent="Pipeline failed";
          btn.disabled=true;
          btn.className="px-5 py-2 rounded-full bg-rose-100 text-rose-700";
          break;
        }
        if(s.ready){
          const btn=document.getElementById("downloadBtn");
          btn.disabled=false;
          btn.textContent="⬇️ Download PDF";
          btn.className="px-5 py-2 rounded-full bg-blue-600 text-white hover:bg-blue-700";
          btn.onclick=()=>{ window.open(`${API}/api/result/${jobId}`, "_blank"); };
          break;
        }
        await new Promise(r=>setTimeout(r,1200));
      }
    }
    poll(job);
  </script>
</body>
</html>
