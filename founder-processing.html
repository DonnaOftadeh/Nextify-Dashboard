<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nextify – Processing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto py-12 px-4 text-center">
    <h1 class="text-2xl font-bold mb-6">Running your analysis</h1>

    <div class="w-full bg-gray-200 rounded-full h-4 mb-4">
      <div id="progressBar" class="bg-blue-600 h-4 rounded-full" style="width: 0%"></div>
    </div>
    <p>Status: <span id="statusText">—</span></p>
    <p>Step: <span id="stepText">—</span></p>
    <p><span id="pct">0%</span></p>

    <button id="downloadBtn" disabled class="bg-gray-400 text-white px-6 py-2 rounded mt-6">Download Report</button>
  </div>

  <script>
  (async function () {
    let NEXTIFY_API_BASE = localStorage.getItem("NEXTIFY_API_BASE") || "";
    if (!/^https:\/\/.+/.test(NEXTIFY_API_BASE)) {
      const v = prompt("Enter your API base (ngrok https URL):", "https://xxxxx.ngrok-free.app");
      if (v && /^https:\/\/.+/.test(v.trim())) {
        NEXTIFY_API_BASE = v.trim();
        localStorage.setItem("NEXTIFY_API_BASE", NEXTIFY_API_BASE);
      } else return;
    }

    const q = new URLSearchParams(location.search);
    const job = q.get("job");
    if (!job) { console.warn("No job id"); return; }

    const progressBar = document.getElementById("progressBar");
    const statusText  = document.getElementById("statusText");
    const stepText    = document.getElementById("stepText");
    const pctText     = document.getElementById("pct");
    const downloadBtn = document.getElementById("downloadBtn");

    function setPct(n) {
      const p = Math.max(0, Math.min(100, parseInt(n || 0, 10)));
      progressBar.style.width = p + "%";
      pctText.textContent = p + "%";
    }

    try {
      while (true) {
        const r = await fetch(`${NEXTIFY_API_BASE}/api/status/${encodeURIComponent(job)}`, { cache: "no-store" });
        const s = await r.json();
        setPct(s.progress);
        statusText.textContent = s.status || "";
        stepText.textContent   = s.step   || "";

        if (s.status === "failed") {
          downloadBtn.disabled = true;
          downloadBtn.textContent = "Run failed";
          alert("Pipeline failed: " + (s.message || ""));
          break;
        }

        if (s.ready) {
          const pdfURL = `${NEXTIFY_API_BASE}/api/result/${encodeURIComponent(job)}`;
          downloadBtn.disabled = false;
          downloadBtn.textContent = "Download report";
          downloadBtn.onclick = () => { window.location.href = pdfURL; };
          break;
        }
        await new Promise(res => setTimeout(res, 1200));
      }
    } catch (e) {
      alert("Cannot reach backend.\n\n" + e.message);
    }
  })();
  </script>
</body>
</html>
