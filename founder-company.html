<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nextify • Founder – Company</title>

  <!-- Tailwind & font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    /* red asterisk on required labels */
    .label-required::after { content: " *"; color: #ef4444; font-weight: 600; margin-left: 2px; }
    /* softer placeholder */
    input::placeholder, textarea::placeholder, select:invalid { color: #9ca3af; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold text-blue-700">Nextify</a>
      <a href="roles.html" class="text-sm text-gray-600 hover:text-blue-600">← Back to roles</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Founder • Benchmark a Company</h1>
    <p class="text-gray-600 mb-8">Tell us the company you want to benchmark against. We’ll use your input to guide the multi-agent analysis.</p>

    <!-- NOTE: onsubmit="return false" keeps validation but prevents navigation (we’ll wire it in Stage 2) -->
    <form id="company-form" onsubmit="return false" class="bg-white rounded-2xl shadow p-6 md:p-8 space-y-6">
      <!-- Benchmark company (required) -->
      <div>
        <label for="bench_company" class="block text-sm font-semibold text-gray-800 label-required">Benchmark company</label>
        <input
          id="bench_company"
          name="bench_company"
          type="text"
          required
          placeholder="e.g., Spotify"
          class="mt-2 block w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
        <p class="mt-2 text-xs text-gray-500">Use a well-known company to anchor the analysis.</p>
      </div>

      <!-- (optional) add more fields now or later; mark required ones by adding 'required' and the label-required class -->
      <!--
      <div>
        <label for="target_market" class="block text-sm font-semibold text-gray-800">Target market</label>
        <input id="target_market" name="target_market" type="text" placeholder="e.g., Gen Z creators in EU"
               class="mt-2 block w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
      </div>
      -->

      <div class="flex items-center gap-3 pt-2">
        <a href="roles.html"
           class="inline-flex justify-center px-5 py-3 rounded-full border border-gray-300 text-gray-700 hover:bg-gray-50">
          Cancel
        </a>

        <!-- Continue triggers browser validation now; we’ll wire it to the processing page in Stage 2 -->
        <button type="submit"
                class="inline-flex justify-center px-6 py-3 rounded-full bg-blue-600 text-white font-semibold hover:bg-blue-700 focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          Continue
        </button>
      </div>
    </form>
  </main>
  <script>
  // redirect to processing page with the company as a query param
  document.getElementById('company-form').addEventListener('submit', function () {
    const v = document.getElementById('bench_company').value.trim();
    if (!v) return; // browser required validation already handles empty case
    const qs = new URLSearchParams({ bench_company: v });
    window.location.href = `founder-processing.html?${qs.toString()}`;
    });
  </script>
</body>
</html>
